<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>تأكيد الحجز</title>
</head>
<body>
    <h2>تأكيد الحجز للمريض: {{ appointment.patient.name }}</h2>

    {% if success %}
        <p style="color:green;">{{ success }}</p>
    {% endif %}
    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <label>ادخل رمز OTP:</label>
        <input type="text" name="otp" required>
        <button type="submit">تأكيد</button>
    </form>
</body>
</html>
